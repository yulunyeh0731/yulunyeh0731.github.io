<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台</title>
<link rel="stylesheet" href="./app.css">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
<script>window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){var l=document.getElementById('loading');if(l)l.textContent='\u767b\u5165\u51fd\u5f0f\u5eab\u8f09\u5165\u5931\u6557\uff0c\u8acb\u78ba\u8a8d\u7db2\u8def\u662f\u5426\u80fd\u5b58\u53d6 cdn.jsdelivr.net';}},true);</script>
</head>
<body>

<div class="scrim" id="scrim" onclick="closeNav()"></div>

<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-name">工作台</span>
      <span class="brand-sub">Yulun ・ 企劃與總務</span>
    </div>
    <button class="nav-item ready active" data-mod="dashboard" onclick="go('dashboard')"><span class="dot"></span>儀表板</button>

    <div class="nav-group">工作</div>
    <button class="nav-item" data-mod="requests" onclick="go('requests')"><span class="dot"></span>受理登記</button>
    <button class="nav-item" data-mod="todos" onclick="go('todos')"><span class="dot"></span>待辦事項</button>
    <button class="nav-item" data-mod="annual" onclick="go('annual')"><span class="dot"></span>年度行事曆</button>

    <div class="nav-group">專案</div>
    <button class="nav-item ready" data-mod="exhibitions" onclick="go('exhibitions')"><span class="dot"></span>展覽</button>
    <button class="nav-item" data-mod="projects" onclick="go('projects')"><span class="dot"></span>專案管理</button>

    <div class="nav-group">資料</div>
    <button class="nav-item" data-mod="external" onclick="go('external')"><span class="dot"></span>對外資料</button>
    <button class="nav-item" data-mod="basedata" onclick="go('basedata')"><span class="dot"></span>基礎資料</button>

    <div class="nav-group">系統</div>
    <button class="nav-item" data-mod="trash" onclick="go('trash')"><span class="dot"></span>回收桶</button>
  </aside>

  <main>
  <div class="wrap">

    <header>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="hamburger" onclick="openNav()" aria-label="開啟選單">☰</button>
        <h1 id="page-title">儀表板</h1>
      </div>
      <div class="head-meta">
        <span class="mode-badge mode-ro" id="mode-badge">唯讀</span>
        <span id="updated-label"></span>
      </div>
    </header>

    <div id="loading" class="loading">啟動中…</div>

    <div id="signin" class="card hidden" style="text-align:center; padding:2.5rem 1.25rem;">
      <p style="font-size:16px; font-weight:600; margin:0 0 4px;">工作台</p>
      <p style="font-size:12px; color:var(--text-tertiary); margin:0 0 22px;">Yulun ・ 企劃與總務</p>
      <button onclick="signIn()" style="font-family:inherit; font-size:14px; font-weight:600;
        background:var(--text); color:#fff; border:0; border-radius:10px; padding:11px 26px; cursor:pointer;">
        使用公司帳號登入
      </button>
      <p id="signin-hint" class="empty-note" style="margin:18px 0 0; line-height:1.8;"></p>
    </div>

    <!-- ============ 模組：儀表板 ============ -->
    <div id="mod-dashboard" class="module hidden">
      <div class="card">
        <p class="section-title">今天要注意什麼</p>
        <div id="dash-alerts" style="font-size:13px; line-height:1.9;"></div>
      </div>
      <div class="card">
        <p class="section-title" id="dash-ex-label">展覽</p>
        <div class="stats-grid stats-3">
          <div class="stat-box stat-confirmed"><p>確定參加</p><p id="dash-ex-confirmed">-</p></div>
          <div class="stat-box stat-evaluating"><p>評估中</p><p id="dash-ex-evaluating">-</p></div>
          <div class="stat-box stat-done"><p>已結案</p><p id="dash-ex-done">-</p></div>
        </div>
        <p style="font-size:12.5px; color:var(--text-tertiary); margin:14px 0 0; padding-top:12px; border-top:1px solid var(--border);">
          其他模組建置後，會在這一頁一起彙總。
        </p>
      </div>
    </div>

    <!-- 展覽模組的版面由 exhibitions.js 掛載，不寫在這裡——它跟 /exhibitions/ 共用同一份 -->
    <div id="mod-exhibitions" class="module hidden"></div>
    <!-- ============ 尚未建置的模組共用一個畫面 ============ -->
    <div id="mod-todo" class="module hidden">
      <div class="card todo-note">
        <h2 id="todo-title">尚未建置</h2>
        <p id="todo-desc"></p>
      </div>
    </div>

  </div>
  </main>
</div>

<div id="toast"></div>

<div id="toast"></div>

<!-- 這一頁的重新導向 URI 是根目錄，必須在 core.js 之前宣告 -->
<script>const REDIRECT_URI = 'https://yulunyeh0731.github.io/';</script>
<script src="./core.js"></script>
<script src="./exhibitions.js"></script>
<script>
const MODULES = {
  dashboard:   { title: '儀表板',     ready: true  },
  requests:    { title: '受理登記',   ready: false, desc: '總務與企劃共用一張清單，用「部門」欄位分。可以做的事：新增一筆、推進狀態、指派負責人、結案。' },
  todos:       { title: '待辦事項',   ready: false, desc: '指派、打勾完成、改期。三個視角：我的待辦、我派出的、部門檢視。' },
  annual:      { title: '年度行事曆', ready: false, desc: '年度或半年一次、由外部死線驅動的工作。觸發器是日期，不是別人的郵件。內容還沒盤點過——建這張清單之前要先問出實際每年要交出去的東西有哪些。' },
  exhibitions: { title: '展覽',       ready: true  },
  projects:    { title: '專案管理',   ready: false, desc: '兩張清單：專案主體掛階段，工項各自有廠商、時程、驗收。樓層整修是第一個。' },
  external:    { title: '對外資料',   ready: false, desc: '一筆資料 × 一個出口 = 跟上了沒。到期提醒去催來源，出口欄位顯示哪裡還是舊版。' },
  basedata:    { title: '基礎資料',   ready: false, desc: '分類選項與人員清單。人員只放實際會用系統的那幾位，不從公司目錄抓全部。' },
  trash:       { title: '回收桶',     ready: false, desc: '刪除一律軟刪除，改一個「已刪除」欄位，各模組過濾掉它。資料還在，可還原。' }
};
let currentMod = 'dashboard';

function go(mod) {
  currentMod = mod;
  const meta = MODULES[mod];
  document.getElementById('page-title').textContent = meta.title;
  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.mod === mod));
  document.querySelectorAll('.module').forEach(m => m.classList.add('hidden'));

  if (meta.ready) {
    document.getElementById('mod-' + mod).classList.remove('hidden');
    if (mod === 'exhibitions') showMain();
    if (mod === 'dashboard') renderDashboard();
  } else {
    document.getElementById('todo-title').textContent = meta.title + '　·　尚未建置';
    document.getElementById('todo-desc').textContent = meta.desc || '';
    document.getElementById('mod-todo').classList.remove('hidden');
  }
  closeNav();
  window.scrollTo(0, 0);
}

function openNav() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closeNav() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}

document.querySelectorAll('.nav-item').forEach(b => {
  if (MODULES[b.dataset.mod] && MODULES[b.dataset.mod].ready) b.classList.add('ready');
});
/* ================================================================
   四、模組：儀表板　—　彙總各清單。目前只有展覽，其他模組建好後接進來
   ================================================================ */
// 儀表板看的是「今年」，跟展覽模組的年度分頁無關。
// 舊版共用 currentYear，結果在展覽點了 2025，回儀表板數字也跟著變成 2025。
function dashboardYear() {
  const years = [...new Set(exhibitions.map(e => e['年度']).filter(Boolean))].sort();
  const thisYear = String(new Date().getFullYear());
  return years.includes(thisYear) ? thisYear : (years[years.length - 1] || null);
}

function renderDashboard() {
  const year = dashboardYear();
  const list = exhibitions.filter(e => e['年度'] === year);
  document.getElementById('dash-ex-label').textContent = year ? `展覽　·　${year} 年度` : '展覽';
  document.getElementById('dash-ex-confirmed').textContent = list.filter(e => e['參展狀態'] === '確定參加').length;
  document.getElementById('dash-ex-evaluating').textContent = list.filter(e => e['參展狀態'] === '評估中').length;
  document.getElementById('dash-ex-done').textContent = list.filter(e => e['參展狀態'] === '已結案').length;

  const alerts = [];
  const n = nextExhibition(list);
  if (n) {
    const di = daysInfo(n);
    alerts.push(`下一場　<strong>${n['展覽名稱']}</strong>　·　${shortDate(n['展期開始'])} 開展　·　`
      + `<span class="${di.cls}" style="font-weight:600;">${di.text}</span>`
      + (n['地點城市'] ? `　·　${n['地點城市']}` : ''));
  }
  const notReady = list.filter(e => e['參展狀態'] === '確定參加')
    .filter(e => Object.values(STAGE_FIELDS).some(zh => e[zh] !== '是'));
  if (notReady.length) {
    alerts.push(`前置階段未完成　<strong>${notReady.length}</strong> 場　·　`
      + notReady.slice(0, 3).map(e => e['展覽名稱']).join('、')
      + (notReady.length > 3 ? ' 等' : ''));
  }
  if (!canWrite) {
    alerts.push('<span class="empty-note">目前是唯讀模式。寫入權限經組織同意後，狀態與勾選可直接在這裡點按修改。</span>');
  }
  document.getElementById('dash-alerts').innerHTML = alerts.length
    ? alerts.map(a => '<div>' + a + '</div>').join('')
    : '<span class="empty-note">目前沒有需要注意的事。</span>';
}

// 資料讀完後：掛上展覽模組的版面，畫年度分頁，停在儀表板
function onDataLoaded() {
  mountExhibitions(document.getElementById('mod-exhibitions'));
  renderYearTabs();
  go('dashboard');
}

boot();
</script>
</body>
</html>
